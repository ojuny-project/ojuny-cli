name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v0.1.0
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag=""
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n1 | grep -oE '^v[0-9][0-9A-Za-z._-]*' || true)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Create release tag before building
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          remote_tag=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$remote_tag" ]; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            existing=$(git rev-parse "$TAG^{commit}")
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG already points to $existing, not $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi


      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # nix bundle produces a self-extracting executable, so users can run the
      # assets directly without a binary cache.
      - name: Bundle ojuny-cli
        run: |
          mkdir -p dist
          nix bundle .#packages.x86_64-linux.ojuny-cli -o dist/ojuny-cli
          cp -L dist/ojuny-cli dist/ojuny-cli.bin
          rm -f dist/ojuny-cli

      - name: Bundle ojuny-patches-cli
        run: |
          nix bundle .#packages.x86_64-linux.ojuny-patches-cli -o dist/ojuny-patches-cli
          cp -L dist/ojuny-patches-cli dist/ojuny-patches.bin
          rm -f dist/ojuny-patches-cli

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ojuny-cli.bin ojuny-patches.bin > SHA256SUMS

      # The release also publishes a small flake. Add it as an input and use
      # packages.<system>.ojuny-cli or .ojuny-patches. The fetchurl hash pins
      # the downloaded bundle, so the package is reproducible without a cache.
      - name: Generate release flake
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          cli_sha=$(sha256sum dist/ojuny-cli.bin | cut -d' ' -f1)
          patches_sha=$(sha256sum dist/ojuny-patches.bin | cut -d' ' -f1)
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          mkdir -p dist/flake
          cat > dist/flake/flake.nix <<EOF
          {
            inputs.nixpkgs.url = "github:NixOS/nixpkgs/nixos-unstable";

            outputs = { self, nixpkgs }:
              let
                systems = [ "x86_64-linux" ];
                forAllSystems = f: nixpkgs.lib.genAttrs systems (system: f nixpkgs.legacyPackages.\${system});
                mk = pkgs: name: url: sha: pkgs.stdenvNoCC.mkDerivation {
                  pname = name;
                  version = "${TAG}";
                  src = pkgs.fetchurl {
                    inherit url;
                    sha256 = sha;
                  };
                  dontUnpack = true;
                  dontFixup = true;
                  installPhase = "install -Dm755 \$src \$out/bin/\${name}";
                };
              in {
                packages = forAllSystems (pkgs: {
                  ojuny-cli = mk pkgs "ojuny-cli" "${base}/ojuny-cli.bin" "${cli_sha}";
                  ojuny-patches = mk pkgs "ojuny-patches" "${base}/ojuny-patches.bin" "${patches_sha}";
                  default = mk pkgs "ojuny-cli" "${base}/ojuny-cli.bin" "${cli_sha}";
                });
              };
          }
          EOF
          tar -czf dist/ojuny-cli-flake.tar.gz -C dist/flake flake.nix

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            dist/ojuny-cli.bin
            dist/ojuny-patches.bin
            dist/SHA256SUMS
            dist/ojuny-cli-flake.tar.gz
